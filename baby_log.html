<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baby Log 📋 (Online)</title>
  <style>
    /* --- CSS ŠTÝLY (Bez zmeny) --- */
    :root {
      --bg: #fff8ee;
      --card: #ffffff;
      --shadow: rgba(0,0,0,0.08);
      --radius: 16px;
      --font: "Poppins", sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: #333;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    h1 {
      font-size: 1.8em;
      margin-bottom: 10px;
      text-align: center;
      color: #444;
    }

    .status-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .info-box {
      flex: 1;
      background: #fff;
      padding: 10px;
      border-radius: var(--radius);
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      text-align: center;
      border: 2px solid transparent;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .feed-box { border-color: #ffb3b3; }
    .vitamin-box { border-color: #ddd; background: #f9f9f9; }
    .vitamin-box.done { border-color: #a3e635; background: #f0fdf4; }

    .info-label { font-size: 0.75em; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
    .info-value { font-size: 1.4em; font-weight: bold; color: #333; }
    .feed-time { color: #e65c5c; }
    .vitamin-status { color: #888; }
    .vitamin-box.done .vitamin-status { color: #449e48; }

    .buttons {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 400px;
      gap: 12px;
      margin-bottom: 20px;
    }

    .action-btn {
      border: none;
      border-radius: var(--radius);
      padding: 18px;
      font-size: 1.2em;
      font-weight: 600;
      color: #333;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
      box-shadow: 0 3px 6px var(--shadow);
      width: 100%;
    }
    .action-btn:active { transform: scale(0.97); }

    .feed   { background: #ffb3b3; color: #333; }
    .diaper { background: #ffe08a; color: #333; }
    .vitamin{ background: #fffacd; border: 2px solid #fce588; color: #333; }
    .clear  { background: #ff6961; color: #fff; }

    .log {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 2px 8px var(--shadow);
      padding: 15px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .entry {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
      font-size: 1.1em;
    }
    .entry:last-child { border-bottom: none; }
    .category { font-weight: 600; font-size: 1em; color: #666; }
    .entry-right { display: flex; align-items: center; gap: 10px; }
    
    .time { 
      font-weight: bold; 
      font-size: 1.2em; 
      color: #333; 
      cursor: pointer; 
      text-decoration: underline;
      text-decoration-style: dotted;
      text-underline-offset: 4px;
      text-decoration-color: #aaa;
      transition: color 0.2s;
    }
    .time:hover {
      color: #007bff;
      text-decoration-color: #007bff;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: #ff4d4d;
      font-weight: bold;
      font-size: 1.2em;
      cursor: pointer;
      padding: 5px 10px;
      border-radius: 8px;
    }
    .delete-btn:hover { background: #fff0f0; }

    .interval-btn {
      width: 100%;
      max-width: 400px;
      margin: -12px 0 20px;
      padding: 10px;
      border: 2px dashed #ffb3b3;
      border-radius: var(--radius);
      background: #fff;
      font-family: inherit;
      font-size: 0.95em;
      color: #555;
      cursor: pointer;
    }
    .interval-btn:hover { background: #fff0f0; }
    .interval-btn b { color: #e65c5c; }

    .last-update { font-size: 0.9em; color: #888; margin-top: 10px; text-align: center; }
    .loading { text-align: center; color: #888; font-style: italic; }

    @media (min-width: 480px) {
      h1 { font-size: 2em; }
      .entry { font-size: 1.2em; }
      .action-btn { font-size: 1.3em; }
    }
  </style>
</head>
<body>
  <h1>👶 Baby Log <span style="font-size:0.5em; vertical-align:middle; color:green;">(Online)</span></h1>

  <div class="status-container">
    <div class="info-box feed-box" id="nextFeedBox" style="display:none;">
      <span class="info-label">Ďalšie papanie</span>
      <span id="nextFeedTime" class="info-value feed-time">--:--</span>
    </div>
    <div class="info-box vitamin-box" id="vitaminBox">
      <span class="info-label">Vitamín D (<span id="dateLabel">--.--</span>)</span>
      <span id="vitaminStatus" class="info-value vitamin-status">❌ Nie</span>
    </div>
  </div>

  <button class="interval-btn" id="intervalBtn" title="Klikni pre zmenu intervalu">
    ⏱️ Papanie každých <b id="intervalValue">--</b> ✏️
  </button>

  <div class="buttons">
    <button class="action-btn feed">🍼 Papanie</button>
    <button class="action-btn diaper">🧷 Prebalenie</button>
    <button class="action-btn vitamin">☀️ Vitamín D</button>
    <button class="action-btn clear">🗑️ Vymazať všetko</button>
  </div>

  <div class="log" id="log">
    <div class="loading">Pripájam sa k databáze...</div>
  </div>
  <div class="last-update" id="last-update"></div>

  <!-- FIREBASE LOGIKA -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, set, update } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

    // Tvoje údaje
    const firebaseConfig = {
      apiKey: "AIzaSyAPrjv-kUhKMCWzKs2cXeYd1MkGQ1A8daQ",
      authDomain: "baby-log-77a64.firebaseapp.com",
      databaseURL: "https://baby-log-77a64-default-rtdb.firebaseio.com",
      projectId: "baby-log-77a64",
      storageBucket: "baby-log-77a64.firebasestorage.app",
      messagingSenderId: "1039021893386",
      appId: "1:1039021893386:web:9c4c765f5cf1f91ec83cf3",
      measurementId: "G-FFPDQPKFGV"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const logsRef = ref(db, 'logs'); 
    const nextFeedRef = ref(db, 'nextFeed');
    const vitaminRef = ref(db, 'vitaminD');
    const intervalRef = ref(db, 'settings/feedIntervalMinutes');

    const DEFAULT_INTERVAL_MIN = 135; // 2 h 15 min (pôvodná hodnota 2.25 h)
    let feedIntervalMinutes = DEFAULT_INTERVAL_MIN;
    let intervalLoaded = false;
    let latestLogs = null; // posledné načítané logy (pre prepočet pri zmene intervalu)

    const intervalBtn = document.getElementById('intervalBtn');
    const intervalValueEl = document.getElementById('intervalValue');

    const logContainer = document.getElementById('log');
    const lastUpdateEl = document.getElementById('last-update');
    const nextFeedBox = document.getElementById('nextFeedBox');
    const nextFeedTimeEl = document.getElementById('nextFeedTime');
    const vitaminBox = document.getElementById('vitaminBox');
    const vitaminStatusEl = document.getElementById('vitaminStatus');
    const dateLabelEl = document.getElementById('dateLabel');
    const actionButtons = document.querySelectorAll('.action-btn:not(.clear)');
    const clearButton = document.querySelector('.clear');

    function getTime(dateObj = new Date()) {
      return dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    function getTodayDateString() {
      return new Date().toLocaleDateString('sk-SK');
    }

    dateLabelEl.textContent = getTodayDateString();

    // 1. Vitamín D - Kontrola
    onValue(vitaminRef, (snapshot) => {
      const data = snapshot.val();
      const today = getTodayDateString();
      dateLabelEl.textContent = today;
      if (data && data.date === today) {
        vitaminStatusEl.innerHTML = `✅ ${data.time}`;
        vitaminBox.classList.add('done');
      } else {
        vitaminStatusEl.innerHTML = `❌ Nie`;
        vitaminBox.classList.remove('done');
      }
    });

    // 1b. Interval medzi papaniami (uložený v databáze, zdieľaný pre všetky zariadenia)
    function formatInterval(totalMin) {
      const h = Math.floor(totalMin / 60);
      const m = totalMin % 60;
      if (h === 0) return `${m} min`;
      return m === 0 ? `${h} h` : `${h} h ${m} min`;
    }

    // Prijíma "2:15", "2.25", "2,5", "3" (hodiny)
    function parseInterval(input) {
      const s = String(input).trim().replace(',', '.');
      let match = s.match(/^(\d{1,2}):(\d{1,2})$/);
      if (match) {
        const min = Number(match[2]);
        if (min >= 60) return null;
        return Number(match[1]) * 60 + min;
      }
      if (/^\d+(\.\d+)?$/.test(s)) return Math.round(parseFloat(s) * 60);
      return null;
    }

    onValue(intervalRef, (snapshot) => {
      const val = Number(snapshot.val());
      feedIntervalMinutes = val > 0 ? val : DEFAULT_INTERVAL_MIN;
      intervalLoaded = true;
      intervalValueEl.textContent = formatInterval(feedIntervalMinutes);
      // Pri zmene intervalu hneď prepočítaj ďalšie papanie
      if (latestLogs) recalculateNextFeed(latestLogs);
    });

    intervalBtn.addEventListener('click', () => {
      const current = `${Math.floor(feedIntervalMinutes / 60)}:${String(feedIntervalMinutes % 60).padStart(2, '0')}`;
      const input = prompt('Interval medzi papaniami (napr. 2:15 alebo 2.5 h):', current);
      if (input === null) return;
      const minutes = parseInterval(input);
      if (minutes === null || minutes < 15 || minutes > 12 * 60) {
        alert('Neplatný interval. Zadaj napr. 2:15, 2.5 alebo 3 (rozsah 0:15 – 12:00).');
        return;
      }
      if (minutes !== feedIntervalMinutes) {
        set(intervalRef, minutes).catch((error) => alert('Chyba: ' + error.message));
      }
    });

    // 2. Ďalšie papanie - Len zobrazovanie (výpočet je nižšie)
    onValue(nextFeedRef, (snapshot) => {
      const time = snapshot.val();
      if (time) {
        nextFeedTimeEl.textContent = time;
        nextFeedBox.style.display = 'flex';
      } else {
        nextFeedBox.style.display = 'none';
      }
    });

    // 3. LOGY - Hlavná logika (Vykresľovanie + Automatický prepočet)
    onValue(logsRef, (snapshot) => {
      const data = snapshot.val();
      logContainer.innerHTML = '';
      
      let logsArray = [];

      if (data) {
        logsArray = Object.entries(data).map(([key, value]) => {
          return { id: key, ...value };
        });

        // Zoradenie podľa timestamp (najnovšie prvé pre logiku, ale vykresľujeme prepend)
        // Toto je dôležité pre nájdenie posledného papania
        logsArray.sort((a, b) => b.timestamp - a.timestamp);

        // --- AUTOMATICKÝ PREPOČET ĎALŠIEHO PAPANIA ---
        latestLogs = logsArray;
        if (intervalLoaded) recalculateNextFeed(logsArray); // inak sa prepočíta po načítaní intervalu
        // ----------------------------------------------

        // Vykreslenie (cyklus ide od najnovšieho po najstaršie, ale prepend dáva najnovšie hore)
        // Aby sme zachovali poradie na obrazovke tak ako predtým (najnovšie hore),
        // musíme pole prejsť od konca (najstaršie) ak používame prepend, 
        // ALEBO prejdeme od začiatku (najnovšie) a použijeme append?
        // Najjednoduchšie: prejdeme od najstaršieho po najnovšie a prependujeme.
        
        // Kópia pre vykreslenie a otočenie poradia
        [...logsArray].reverse().forEach((entry) => {
          const div = document.createElement('div');
          div.className = 'entry';
          div.innerHTML = `
            <span class="category">${entry.category}</span>
            <div class="entry-right">
              <span class="time" title="Klikni pre zmenu času" data-id="${entry.id}" data-time="${entry.time}">${entry.time}</span>
              <button class="delete-btn" data-id="${entry.id}">✕</button>
            </div>
          `;
          logContainer.prepend(div);
        });

        // Event Listenery
        document.querySelectorAll('.delete-btn').forEach(btn => {
          btn.addEventListener('click', function() {
            deleteEntry(this.getAttribute('data-id'));
          });
        });

        document.querySelectorAll('.time').forEach(span => {
          span.addEventListener('click', function() {
            const id = this.getAttribute('data-id');
            const oldTime = this.getAttribute('data-time');
            editEntryTime(id, oldTime);
          });
        });

      } else {
        // Ak nie sú žiadne logy, vymaž aj čas papania
        latestLogs = [];
        set(nextFeedRef, null);
        logContainer.innerHTML = '<div class="loading">Žiadne záznamy</div>';
      }
      
      lastUpdateEl.textContent = `Aktualizované: ${getTime()}`;
    });

    // --- FUNKCIA NA VÝPOČET ĎALŠIEHO PAPANIA ---
    function recalculateNextFeed(allLogs) {
      // 1. Nájdi všetky záznamy s textom "Papanie"
      // Filtrujeme podľa názvu kategórie (obsahuje "Papanie")
      const feedings = allLogs.filter(log => log.category && log.category.includes('Papanie'));
      
      if (feedings.length > 0) {
        // allLogs sú už zoradené od najnovšieho, takže prvý je posledné papanie
        const lastFeed = feedings[0];
        
        // Rozoberieme čas "HH:MM"
        const [hours, minutes] = lastFeed.time.split(':').map(Number);
        
        // Vytvoríme dátum (použijeme dnešný dátum + čas z logu)
        // Toto je zjednodušenie, ale pre tento účel stačí.
        const feedDate = new Date();
        feedDate.setHours(hours, minutes, 0, 0);
        
        // Pridáme nastavený interval (v minútach, z databázy)
        const nextFeedDate = new Date(feedDate.getTime() + feedIntervalMinutes * 60 * 1000);
        
        const nextFeedString = getTime(nextFeedDate);
        
        // Zapíšeme do Firebase (len ak je iný, ale set to zvládne efektívne)
        set(nextFeedRef, nextFeedString);
      } else {
        // Ak sme vymazali všetky papania
        set(nextFeedRef, null);
      }
    }

    // --- BUTTON CLICK ---
    actionButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const now = new Date();
        const timeNow = getTime(now);
        let category = btn.textContent.trim();
        
        // POZOR: Tu už nenastavujeme nextFeedRef ručne!
        // Len pridáme log a funkcia recalculateNextFeed to spraví automaticky.
        
        if (btn.classList.contains('vitamin')) {
          set(vitaminRef, { date: getTodayDateString(), time: timeNow });
        }

        const entry = { category, time: timeNow, timestamp: Date.now() };
        push(logsRef, entry);
      });
    });

    function deleteEntry(id) {
      if (confirm('Naozaj vymazať tento záznam?')) {
        remove(ref(db, `logs/${id}`));
      }
    }

    function editEntryTime(id, oldTime) {
      const newTime = prompt("Zadaj nový čas (napr. 13:30):", oldTime);
      if (newTime && newTime !== oldTime) {
        // Aktualizujeme čas v logu -> to spustí onValue -> to spustí recalculateNextFeed
        update(ref(db, `logs/${id}`), {
          time: newTime
        }).catch((error) => {
          alert("Chyba: " + error.message);
        });
      }
    }

    clearButton.addEventListener('click', () => {
      if (confirm('Vymazať VŠETKY záznamy?')) {
        remove(logsRef);
        remove(nextFeedRef);
        remove(vitaminRef);
      }
    });

  </script>
</body>
</html>
